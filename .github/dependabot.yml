version: 2

# Grouping trades review noise against blast radius. The rule here: group things that must
# move together, and only those. The first run showed the cost of getting that wrong — a
# `kotlin` group bundling coroutines with Kover and the ABI validator meant one blocked
# coroutines bump held two safe plugin updates hostage, and a `test-dependencies` group
# bundling Kotest with mockk did the same.

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # coroutines-core and coroutines-test must be the same version, and both carry Kotlin
      # metadata the compiler has to be new enough to read. coroutines-core is also an `api`
      # dependency, so its version is part of this library's contract. Grouped deliberately:
      # these two fail together, so they should arrive together.
      coroutines:
        patterns:
          - "org.jetbrains.kotlinx:kotlinx-coroutines*"

      # Build tooling, independent of each other and of the compiler version. Split out of the
      # old `kotlin` group, which matched these by their `org.jetbrains.kotlinx.*` plugin ids
      # and dragged them down with coroutines.
      build-tooling:
        patterns:
          - "org.jetbrains.kotlinx.kover*"
          - "org.jetbrains.kotlinx.binary-compatibility-validator*"
          - "org.jetbrains.dokka*"
          - "io.gitlab.arturbosch.detekt*"

    # Ungrouped on purpose, each reviewed on its own:
    #   net.snowflake:snowflake-jdbc  - the driver whose behaviour this library wraps
    #   com.zaxxer:HikariCP           - PoolConfig's validation encodes its clamping thresholds
    #   io.kotest:*                   - major bumps are test-suite migrations
    #   io.mockk:mockk                - 1.14+ pulls kotlin-stdlib 2.2, which the pinned
    #                                   1.9.23 compiler cannot read; blocked like coroutines
    #   ch.qos.logback:*              - genuinely drop-in, and the only test dependency that
    #                                   is, so it has nothing left to be grouped with
    #   org.jetbrains.kotlin (`jvm`)  - the compiler pin, coupled to the publish plugin
    #   com.vanniktech.maven.publish  - pinned to 0.30.0, the last line supporting Kotlin 1.9.x
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
