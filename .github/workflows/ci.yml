name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build
        run: ./gradlew build -x test

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/

      - name: Detekt static analysis
        run: ./gradlew detekt

# The integration tests in src/integrationTest are not run in CI: they need a live
# Snowflake account, and no SNOWFLAKE_* secrets are configured. A job here would
# only ever report green without connecting to anything, which is worse than no job
# at all. Run them by hand with `./gradlew integrationTest` once credentials exist.
